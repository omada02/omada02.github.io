<style>
/* VARIABLES - Tema tecnologico */
:root {
  --primary: #00d9ff;
  --primary-dark: #00a6cc;
  --primary-light: #33e0ff;
  --secondary: #8be9fd;
  --dark: #0a0e17;
  --darker: #050811;
  --light: #f8fafc;
  --gray: #6272a4;
  --gray-light: #44475a;
  --white: #ffffff;
  --code-bg: #1a1f2e;
  --terminal: #0d1117;
  --shadow: 0 10px 30px rgba(0, 217, 255, 0.1);
  --shadow-lg: 0 20px 40px rgba(0, 217, 255, 0.15);
  --radius: 8px;
  --transition: all 0.3s ease;
  --glow: 0 0 15px rgba(0, 217, 255, 0.5);
}

/* GLOBAL */
* { 
  box-sizing: border-box; 
  margin:0; 
  padding:0; 
}

html {
  scroll-behavior: smooth;
}

body { 
  font-family: 'Inter', sans-serif; 
  background: var(--dark); 
  color: var(--light); 
  line-height: 1.6;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 15% 50%, rgba(0, 217, 255, 0.05) 0%, transparent 55%),
    radial-gradient(circle at 85% 30%, rgba(0, 217, 255, 0.03) 0%, transparent 55%);
}

.code-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0.03;
  z-index: -1;
  pointer-events: none;
  background-image: 
    linear-gradient(90deg, transparent 79px, #abced4 79px, #abced4 81px, transparent 81px),
    linear-gradient(#eee .1em, transparent .1em);
  background-size: 100% 1.2em;
}

a { 
  text-decoration: none; 
  color: inherit;
}

.mono {
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: -0.5px;
}

/* HEADER - Stile terminale */
header { 
  position: sticky; 
  top: 0; 
  background: rgba(10, 14, 23, 0.95);
  backdrop-filter: blur(15px);
  padding: 1.2rem 3rem; 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  border-bottom: 1px solid rgba(0, 217, 255, 0.2);
  z-index: 1000; 
  transition: var(--transition);
  box-shadow: var(--shadow);
}

header.scrolled {
  padding: 0.8rem 3rem;
  border-bottom: 1px solid rgba(0, 217, 255, 0.3);
}

header h1 { 
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700; 
  font-size: 1.6rem; 
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 0.8rem;
}

header h1::before {
  content: '>';
  color: var(--primary);
  font-weight: 800;
}

.terminal-prompt {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--primary);
}

.terminal-prompt::before {
  content: '$';
  color: var(--secondary);
  font-weight: bold;
}

nav { 
  display: flex;
  gap: 2rem;
}

nav a { 
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500; 
  color: var(--gray);
  position: relative;
  padding: 0.5rem 0;
  transition: var(--transition);
  font-size: 0.95rem;
}

nav a:hover {
  color: var(--primary);
}

nav a.active {
  color: var(--primary);
  text-shadow: var(--glow);
}

nav a::before {
  content: '#';
  opacity: 0;
  transition: var(--transition);
  margin-right: 0.3rem;
}

nav a:hover::before {
  opacity: 1;
}

/* Language Toggle Button */
.language-toggle {
  background: transparent;
  color: var(--primary);
  border: 1px solid rgba(0, 217, 255, 0.3);
  padding: 0.5rem 1.2rem;
  border-radius: 4px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.language-toggle:hover {
  background: rgba(0, 217, 255, 0.1);
  border-color: var(--primary);
  box-shadow: var(--glow);
}

/* HERO - Terminal style */
#hero { 
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  padding: 6rem 4rem;
  background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
  overflow: hidden;
  border-bottom: 1px solid rgba(0, 217, 255, 0.2);
}

.terminal-window {
  background: var(--terminal);
  border-radius: var(--radius);
  padding: 3rem;
  max-width: 800px;
  border: 1px solid rgba(0, 217, 255, 0.2);
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}

.terminal-window::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 30px;
  background: rgba(20, 25, 40, 0.8);
  border-bottom: 1px solid rgba(0, 217, 255, 0.2);
}

.terminal-content {
  margin-top: 2rem;
}

.terminal-line {
  margin-bottom: 1.5rem;
  display: flex;
  align-items: flex-start;
  gap: 1rem;
}

.line-prompt {
  color: var(--secondary);
  font-family: 'JetBrains Mono', monospace;
  font-weight: bold;
  white-space: nowrap;
}

.line-content {
  color: var(--light);
  font-family: 'JetBrains Mono', monospace;
  flex: 1;
}

.blinking-cursor {
  display: inline-block;
  width: 8px;
  height: 1.2em;
  background-color: var(--primary);
  margin-left: 2px;
  animation: blink 1s infinite;
  vertical-align: middle;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

.hero-image {
  width: 200px;
  height: 200px;
  border-radius: var(--radius);
  border: 2px solid rgba(0, 217, 255, 0.3);
  object-fit: cover;
  margin-bottom: 2rem;
  box-shadow
